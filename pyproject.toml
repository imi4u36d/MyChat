[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MyChat"
version = "0.1.0"
description = "MyChat: local-first WeChat chat analysis with a WeChat-style UI and a local LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MyChat contributors" }]
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
mychat = "mychat.__main__:main"

[tool.setuptools.packages.find]
include = ["mychat*"]

[tool.setuptools.package-data]
mychat = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
